<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>artificery.io D&D Beyond Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-title">
        <img src="icons/icon48.png" alt="D&D Beyond Filter" class="popup-icon" width="48" height="48">
        <h1>artificio.io<br>D&D Beyond Owned-Sources Filter</h1>
      </div>
      <div class="popup-version" id="popupVersion">v1.1.0</div>
    </div>

    <!-- Filter Status Section -->
    <div class="popup-section">
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-label">Auto-Filter</div>
          <div class="setting-description">Automatically filter content by owned sources</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="filterToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Sources Section -->
    <div class="popup-section">
      <h2 class="section-title">Your Sources (<span id="sourcesCount">0</span>)</h2>

      <div id="sourcesList" class="sources-list"></div>

      <div id="emptyState" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <p>No sources detected</p>
        <span>Click "Update Sources" to scan your library</span>
      </div>
    </div>

    <!-- Actions Section -->
    <div class="popup-section">
      <h2 class="section-title">Actions</h2>
      <div class="action-buttons">
        <button class="action-btn action-btn--primary" id="updateSourcesBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M14 8a6 6 0 11-12 0 6 6 0 0112 0z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 4v4l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Update Sources</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <div id="lastUpdated" class="footer-status">Never updated</div>
      <div class="footer-note">
        Reference sources (UA, Sage Advice) excluded
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
