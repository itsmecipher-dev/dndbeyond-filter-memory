<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>artificery.io D&D Beyond Filter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-title">
        <img src="icons/icon48.png" alt="D&D Beyond Filter" class="popup-icon" width="48" height="48">
        <h1>artificio.io<br>D&D Beyond Owned-Sources Filter</h1>
      </div>
      <div class="popup-version" id="popupVersion">v1.2.0</div>
    </div>

    <!-- Filter Status Section -->
    <div class="popup-section">
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-label">Auto-Filter</div>
          <div class="setting-description">Automatically filter content by owned sources</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="filterToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Sources Summary Section -->
    <div class="popup-section">
      <h2 class="section-title">Your Sources</h2>
      <div id="sourcesSummary" class="sources-summary">
        <div class="summary-item">
          <span class="summary-icon">📚</span>
          <span class="summary-count" id="sourcebookCount">0</span>
          <span class="summary-label">Sourcebooks</span>
        </div>
        <div class="summary-item">
          <span class="summary-icon">🗺️</span>
          <span class="summary-count" id="adventureCount">0</span>
          <span class="summary-label">Adventures</span>
        </div>
      </div>
      <div id="emptyState" class="empty-state">
        <p>No sources detected</p>
        <span>Click "Update Sources" to scan your library</span>
      </div>
    </div>

    <!-- Actions Section -->
    <div class="popup-section">
      <h2 class="section-title">Actions</h2>
      <div class="action-buttons">
        <button class="action-btn action-btn--primary" id="updateSourcesBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M14 8a6 6 0 11-12 0 6 6 0 0112 0z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 4v4l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Update Sources</span>
        </button>
        <button class="action-btn action-btn--secondary" id="manageSourcesBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Manage Sources</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <div id="lastUpdated" class="footer-status">Never updated</div>
      <div class="footer-note">
        Reference sources (UA, Sage Advice) excluded
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
